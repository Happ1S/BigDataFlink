services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: BigData
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_network

  kafka:
    image: apache/kafka:4.0.2
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9091
      KAFKA_LISTENERS: CONTROLLER://:9091,DOCKER://:9093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: DOCKER://kafka:9093,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - app_network

  kafka-init:
    image: apache/kafka:4.0.2
    container_name: kafka_init
    depends_on:
      - kafka
    command: >
      bash -c "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9093 --create --if-not-exists --topic mock_data_topic --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9093 --describe --topic mock_data_topic
      "
    networks:
      - app_network

  jobmanager:
    build: .
    container_name: jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: jobmanager
    volumes:
      - ./mock_data:/opt/flink/data
      - ./app:/opt/flink/app
    networks:
      - app_network

  taskmanager:
    build: .
    container_name: taskmanager
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: jobmanager
      TASK_MANAGER_NUMBER_OF_TASK_SLOTS: 2
    volumes:
      - ./app:/opt/flink/app
    networks:
      - app_network

  csv-producer:
    build: .
    container_name: csv_producer
    depends_on:
      - kafka-init
    command: >
      bash -c "
      sleep 5 &&
      python3 /opt/flink/app/csv_to_kafka_job.py
      "
    volumes:
      - ./mock_data:/opt/flink/data
      - ./app:/opt/flink/app
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  pgdata: